[bootstrap.repos]
"~/projects/chrome-stylize" = { url = "https://github.com/psephopaiktes/chrome-stylize.git" }
"~/projects/hira.page" = { url = "https://github.com/psephopaiktes/hira.page.git" }

[dotfiles]
"~/.Brewfile" = { mode = "absent" }
"~/.claude/settings.json" = { mode = "symlink" }
"~/.claude/statusline.sh" = { mode = "symlink" }
"~/.codex/config.toml" = { mode = "copy", create_if_missing = true }
"~/.config/gh/config.yml" = { mode = "symlink" }
"~/.config/ghostty/config" = { mode = "symlink" }
"~/.config/snapzy/config.toml" = { mode = "symlink" }
"~/.gemini/antigravity-cli/settings.json" = { mode = "symlink" }
"~/.gemini/antigravity-cli/statusline.sh" = { mode = "symlink" }
"~/.gemini/settings.json" = { mode = "symlink" }
"~/.gitconfig" = { mode = "symlink" }
"~/.gitignore_global" = { mode = "symlink" }
"~/.npmrc" = { mode = "symlink" }
"~/.zshenv" = { mode = "symlink" }
"~/.zshrc" = { mode = "symlink" }
"~/AGENTS.md" = { mode = "symlink" }
"~/.codex/AGENTS.md" = { source = "~/projects/dotfiles/.bin/AGENTS.md", mode = "symlink" }
"~/.claude/CLAUDE.md" = { source = "~/projects/dotfiles/.bin/AGENTS.md", mode = "symlink" }
"~/.copilot/copilot-instructions.md" = { source = "~/projects/dotfiles/.bin/AGENTS.md", mode = "symlink" }
"~/.gemini/AGENTS.md" = { source = "~/projects/dotfiles/.bin/AGENTS.md", mode = "symlink" }

[bootstrap.settings.macos.dock]
autohide = true
tilesize = 48
magnification = true
largesize = 64
show_recents = false
mru_spaces = false

[bootstrap.settings.macos.finder]
show_all_files = true
show_pathbar = true
show_status_bar = true
show_extensions_warning = false

[bootstrap.settings.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15
automatic_capitalization = false
automatic_spelling_correction = false

[bootstrap.settings.macos.defaults.NSGlobalDomain]
AppleAccentColor = -1
AppleAquaColorVariant = 6
AppleInterfaceStyleSwitchesAutomatically = true
AppleKeyboardUIMode = 3
AppleScrollerPagingBehavior = 1
AppleShowAllExtensions = true
AppleWindowTabbingMode = "always"
NSAutomaticDashSubstitutionEnabled = false
NSAutomaticPeriodSubstitutionEnabled = false
NSAutomaticQuoteSubstitutionEnabled = false
NSCloseAlwaysConfirmsChanges = true
NSRecentApplicationsLimit = 10
NSRecentDocumentsLimit = 10
NSRecentServersLimit = 10

[bootstrap.settings.macos.defaults."com.apple.dock"]
"expose-group-apps" = true
mineffect = "scale"
"minimize-to-application" = true
"wvous-bl-corner" = 3
"wvous-bl-modifier" = 0
"wvous-br-corner" = 5
"wvous-br-modifier" = 0

[bootstrap.settings.macos.defaults."com.apple.finder"]
FXDefaultSearchScope = "SCsp"
FXRemoveOldTrashItems = true
FXSortFoldersFirst = true
FXSortFoldersFirstOnDesktop = true
NewWindowTarget = "PfDe"
NewWindowTargetPath = "file:///Users/a-hirata/Desktop/"
QLEnableTextSelection = true
WarnOnEmptyTrash = false
_FXShowPosixPathInTitle = true

[bootstrap.settings.macos.defaults."com.apple.menuextra.clock"]
FlashDateSeparators = true

[bootstrap.settings.macos.defaults."com.apple.screensaver"]
askForPassword = 1
idleTime = 0

[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["27", "enabled"]
value = true

[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["27", "value", "parameters"]
value = [65535, 48, 524288]

[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["28", "enabled"]
value = false

[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["29", "enabled"]
value = false

[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["30", "enabled"]
value = false

[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["31", "enabled"]
value = false

[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["64", "enabled"]
value = false

[[bootstrap.settings.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["65", "enabled"]
value = false

[bootstrap.hooks]
pre-defaults = """osascript -e 'tell application "System Settings" to quit' >/dev/null 2>&1 || true"""
post-defaults = """
killall Finder Dock SystemUIServer >/dev/null 2>&1 || true
qlmanage -r >/dev/null 2>&1 || true
"""

[tasks.bootstrap]
description = "miseで宣言できない初期設定を行う"
run = "zsh ~/projects/dotfiles/shell/bootstrap.sh"
interactive = true

[tasks.check]
description = "dotfilesの構文と設定を検査する"
run = "zsh ~/projects/dotfiles/shell/check.sh"

[tasks."skills:check"]
description = "Agent Skillsの更新を確認する"
run = "zsh ~/projects/dotfiles/shell/update-skills.sh --check"

[tasks."skills:update"]
description = "Agent Skillsを更新する"
run = "zsh ~/projects/dotfiles/shell/update-skills.sh --sync"
