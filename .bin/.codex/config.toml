# Initial setup template for ~/.codex/config.toml.
# ChatGPT and Codex own the active file, so link.sh never overwrites it.
# Update this template and the active file together when changing personal defaults.

model = "gpt-5.6-sol"
model_reasoning_effort = "ultra"
hide_agent_reasoning = true
notify = ["bash", "-lc", "afplay /System/Library/Sounds/Ping.aiff"]

[tui]
status_line = ["current-dir", "git-branch", "model-with-reasoning", "context-used"]
status_line_use_colors = true

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"

[mcp_servers.chrome-devtools]
command = "/bin/zsh"
args = ["-c", "exec mise x -- chrome-devtools-mcp --categoryExtensions --memoryDebugging"]

[desktop]
followUpQueueMode = "steer"
conversationDetailMode = "STEPS_PROSE"
sansFontSize = 14
codeFontSize = 13
ambient-suggestions-enabled = false
selected-avatar-id = "null-signal"
avatar-overlay-pet-visible = false
open-link-in-target-preference = "external-browser"
open-local-url-in-target-preference = "external-browser"
confirm-before-close = "never"
